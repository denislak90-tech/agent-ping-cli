name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "Problem", description: "What maintainer/user pain does this solve?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "Proposed solution" }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: "Alternatives considered" }
  - type: checkboxes
    id: secrets
    attributes:
      label: Secrets hygiene
      options:
        - label: "My request contains no real ntfy topics, message IDs, or state/ contents"
          required: true
